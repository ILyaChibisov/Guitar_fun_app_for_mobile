# .github/workflows/build.yml
name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360   # 6 часов — с запасом на первую сборку

    steps:
      - uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: |
          echo "date=$(date -u '+%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-buildozer-global-

      - name: Cache Buildozer directory in app
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-app-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-buildozer-app-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/android-sdk
          key: ${{ runner.os }}-android-sdk-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/android-ndk
          key: ${{ runner.os }}-android-ndk-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-android-ndk-

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev libunwind-dev zlib1g-dev autoconf-archive \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev uuid-dev \
            libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            zip unzip autoconf libtool automake libltdl-dev m4 pkg-config \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev autopoint gettext libasound2-dev

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.37 requests

      - name: Quarantine long-path files
        run: |
          # Исключаем файлы, чей путь внутри .aab превышает лимит tarfile USTAR.
          # Файлы перемещаются в chords_quarantine/ и не попадают в сборку.
          python utils/quarantine_long_paths.py --limit 90

      - name: Create keystore directory
        run: |
          mkdir -p ./.buildozer/android/platform/

      - name: Setup keystore
        run: |
          KEYSTORE_PATH="./.buildozer/android/platform/guitarfuns_keystore.jks"

          # Проверяем, есть ли keystore в корне проекта
          if [ -f "guitarfuns_keystore.jks" ]; then
            echo "✅ Keystore найден в корне проекта, копируем..."
            cp guitarfuns_keystore.jks $KEYSTORE_PATH
          # Проверяем, есть ли keystore в папке .buildozer
          elif [ -f "$KEYSTORE_PATH" ]; then
            echo "✅ Keystore уже существует в .buildozer"
          else
            echo "⚠️ Keystore не найден, создаем новый..."
            keytool -genkey -v -keystore $KEYSTORE_PATH \
              -alias guitarfuns \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=GuitarFuns, OU=GuitarFuns, O=GuitarFuns, L=City, S=State, C=RU" \
              -storepass lexx311285 \
              -keypass lexx311285 \
              -noprompt
            echo "✅ Новый keystore создан"
          fi

      # --- ПАТЧ GRADLE WRAPPER (ЗЕРКАЛО) ---
      - name: Patch Gradle Wrapper to use a mirror
        run: |
          # Ищем файл gradle-wrapper.properties в папке .buildozer
          WRAPPER_FILE=$(find .buildozer -name "gradle-wrapper.properties" | head -n 1)
          
          if [ -n "$WRAPPER_FILE" ]; then
            echo "Патчим: $WRAPPER_FILE"
            # Заменяем официальный URL на зеркало (Tencent Cloud)
            sed -i 's|https\\://services.gradle.org/distributions/|https://mirrors.cloud.tencent.com/gradle/|g' "$WRAPPER_FILE"
            echo "✅ Ссылка на Gradle заменена на зеркало."
            grep distributionUrl "$WRAPPER_FILE"
          else
            echo "⚠️ Файл gradle-wrapper.properties не найден. Это нормально для первой сборки."
          fi

      # --- ПАТЧ ANDROIDMANIFEST (NETWORK SECURITY) ---
      - name: Patch AndroidManifest template for Network Security Config
        run: |
          # Ищем путь к шаблону манифеста
          MANIFEST_PATH=$(find .buildozer -name "AndroidManifest.tmpl.xml" | head -n 1)
          
          if [ -n "$MANIFEST_PATH" ]; then
            echo "Патчим: $MANIFEST_PATH"
            # Добавляем атрибут в тег <application>, если его там ещё нет
            if ! grep -q 'networkSecurityConfig' "$MANIFEST_PATH"; then
              sed -i 's/<application /<application android:networkSecurityConfig="@xml\/network_security_config" /' "$MANIFEST_PATH"
              echo "✅ Атрибут networkSecurityConfig добавлен."
            else
              echo "ℹ️ Атрибут networkSecurityConfig уже присутствует."
            fi
          else
            echo "⚠️ Шаблон не найден. Возможно, это первая сборка и папка .buildozer ещё не создана."
          fi

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug 2>&1 | tee buildozer_build.log

      - name: Upload APK to Yandex Disk
        if: success()
        env:
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
          ARTIFACT_PATH: bin
          REMOTE_DIR: /github-artifacts
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'EOF'
          import os, glob, requests, sys

          token = os.environ['YANDEX_DISK_TOKEN']
          local_dir = os.environ['ARTIFACT_PATH']
          remote_dir = os.environ['REMOTE_DIR']
          run_number = os.environ['RUN_NUMBER']

          headers = {'Authorization': f'OAuth {token}'}
          api_upload = 'https://cloud-api.yandex.net/v1/disk/resources/upload'
          api_mkdir  = 'https://cloud-api.yandex.net/v1/disk/resources'

          # Создаём подпапку под конкретный запуск, чтобы ничего не перезаписывалось
          run_dir = f'{remote_dir}/run-{run_number}'
          r = requests.put(api_mkdir, headers=headers, params={'path': run_dir})
          if r.status_code not in (200, 201, 409):
              print('Ошибка создания папки:', r.status_code, r.text)
              sys.exit(1)

          # Ищем все APK
          apks = glob.glob(os.path.join(local_dir, '*.apk'))
          if not apks:
              print('❌ APK-файлы не найдены в', local_dir)
              sys.exit(1)

          for apk in apks:
              name = os.path.basename(apk)
              remote_path = f'{run_dir}/{name}'

              # Получаем ссылку на загрузку
              r = requests.get(api_upload, headers=headers,
                               params={'path': remote_path, 'overwrite': 'true'})
              if r.status_code != 200:
                  print('Ошибка получения ссылки:', r.status_code, r.text)
                  sys.exit(1)
              upload_url = r.json()['href']

              # Загружаем
              with open(apk, 'rb') as f:
                  up = requests.put(upload_url, data=f)
              if up.status_code not in (200, 201, 202):
                  print('Ошибка загрузки:', up.status_code, up.text)
                  sys.exit(1)
              print(f'✅ Загружено: {apk} → {remote_path}')
          EOF

      - name: Upload build log to Yandex Disk
        if: always()
        env:
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'EOF'
          import os, requests, sys

          token = os.environ['YANDEX_DISK_TOKEN']
          run_number = os.environ['RUN_NUMBER']
          log_file = 'buildozer_build.log'
          remote_path = f'/github-artifacts/run-{run_number}/{log_file}'

          if not os.path.exists(log_file):
              print('Лог не найден, пропускаем')
              sys.exit(0)

          headers = {'Authorization': f'OAuth {token}'}
          r = requests.get('https://cloud-api.yandex.net/v1/disk/resources/upload',
                           headers=headers,
                           params={'path': remote_path, 'overwrite': 'true'})
          if r.status_code != 200:
              print('Ошибка получения ссылки:', r.status_code, r.text)
              sys.exit(1)

          with open(log_file, 'rb') as f:
              up = requests.put(r.json()['href'], data=f)
          if up.status_code not in (200, 201, 202):
              print('Ошибка загрузки:', up.status_code, up.text)
              sys.exit(1)
          print(f'✅ Лог загружен: {remote_path}')
          EOF