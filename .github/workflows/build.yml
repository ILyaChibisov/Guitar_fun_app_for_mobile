name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        uses: DigiDNA/action-buildozer@v4
        with:
          spec: buildozer.spec

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GuitarFuns-APK
          path: ./bin/*.apk