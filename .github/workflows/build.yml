name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: |
          echo "date=$(date -u '+%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-buildozer-global-

      - name: Cache Buildozer directory in app
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-app-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-buildozer-app-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/android-sdk
          key: ${{ runner.os }}-android-sdk-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/android-ndk
          key: ${{ runner.os }}-android-ndk-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-android-ndk-

      - name: Install System Packages
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev libavformat-dev libavcodec-dev \
            libunwind-dev autoconf-archive libsqlite3-dev \
            sqlite3 bzip2 libbz2-dev libgdbm-dev \
            libgdbm-compat-dev liblzma-dev libreadline-dev \
            uuid-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libgstreamer-plugins-base1.0-dev \
            ccache \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxxf86vm-dev \
            mesa-common-dev

      # 🔥 АГРЕССИВНАЯ ОЧИСТКА libthorvg
      - name: Aggressive cleanup of libthorvg
        run: |
          echo "🧹 Удаляем libthorvg из всех папок..."
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/libthorvg* || true
          rm -rf .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/libthorvg* || true
          rm -rf ~/.buildozer/android/platform/python-for-android/recipes/libthorvg* || true
          rm -rf ~/.buildozer/android/platform/python-for-android/venv/lib/python*/site-packages/libthorvg* || true
          find ~/.buildozer -name "libthorvg" -type d -exec rm -rf {} \; 2>/dev/null || true
          find ~/.buildozer -name "*libthorvg*" -type d -exec rm -rf {} \; 2>/dev/null || true
          echo "✅ libthorvg удалён"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip dependencies
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Show build result
        if: always()
        run: |
          echo "========================================="
          echo "=== CHECKING BUILD RESULT ==="
          echo "========================================="
          echo ""
          echo "=== CONTENT OF bin/ DIRECTORY ==="
          ls -la bin/ || echo "bin/ directory does not exist!"
          echo ""
          echo "=== SEARCHING FOR APK FILES ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found!"
          echo ""
          echo "=== SEARCHING FOR AAB FILES ==="
          find . -name "*.aab" -type f 2>/dev/null || echo "No AAB files found!"
          echo ""

      - name: Show errors from build log
        if: always()
        run: |
          echo "========================================="
          echo "=== ALL ERRORS FROM BUILD LOG ==="
          echo "========================================="
          grep -i -E "(error|failed|fatal|traceback)" build.log | head -100 || echo "No errors found"
          echo ""
          echo "========================================="
          echo "=== LAST 200 LINES OF BUILD LOG ==="
          echo "========================================="
          tail -200 build.log || echo "Log file not found"
          echo ""
          echo "========================================="
          echo "=== KIVY BUILD SPECIFIC ERRORS ==="
          echo "========================================="
          grep -A 20 -B 5 "Failed to build kivy" build.log || echo "No kivy build errors found"
          echo ""
          echo "=== FATAL ERRORS ==="
          grep -A 10 -B 5 "fatal error:" build.log || echo "No fatal errors found"
          echo ""
          echo "=== libthorvg ERRORS ==="
          grep -A 10 -B 5 "libthorvg" build.log || echo "No libthorvg errors found"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GuitarFuns-APK-${{ github.run_number }}
          path: bin/*.apk

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log