# .github/workflows/build.yml
name: Android Build (GuitarFans)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: |
          echo "date=$(date -u '+%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Read App Version from version.py
        id: app-version
        run: |
          APP_VER=$(python3 -c "import version; print(version.__version__)")
          echo "version=$APP_VER" >> $GITHUB_ENV
          echo "📦 Версия сборки: $APP_VER"

      - name: Sync version and title in buildozer.spec
        run: |
          python3 - <<'EOF'
          import os, re

          ver = os.environ['version']
          with open('buildozer.spec', 'r', encoding='utf-8') as f:
              spec = f.read()

          spec = re.sub(r'(?m)^title\s*=.*$', 'title = GuitarFans', spec)
          spec = re.sub(r'(?m)^version\s*=.*$', f'version = {ver}', spec)

          with open('buildozer.spec', 'w', encoding='utf-8') as f:
              f.write(spec)
          print(f"✅ buildozer.spec обновлён: title = GuitarFans, version = {ver}")
          EOF

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-v4-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-buildozer-global-v4-

      - name: Cache Buildozer directory in app
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-app-v4-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-buildozer-app-v4-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/android-sdk
          key: ${{ runner.os }}-android-sdk-v4-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-v4-

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/android-ndk
          key: ${{ runner.os }}-android-ndk-v4-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-android-ndk-v4-

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev libunwind-dev zlib1g-dev autoconf-archive \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev uuid-dev \
            libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            zip unzip autoconf libtool automake libltdl-dev m4 pkg-config \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev autopoint gettext libasound2-dev

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.37 requests

      - name: Create keystore directory
        run: |
          mkdir -p ./.buildozer/android/platform/

      - name: Setup keystore
        run: |
          KEYSTORE_PATH="./.buildozer/android/platform/guitarfuns_keystore.jks"
          if [ -f "guitarfuns_keystore.jks" ]; then
            cp guitarfuns_keystore.jks $KEYSTORE_PATH
          elif [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkey -v -keystore $KEYSTORE_PATH \
              -alias guitarfuns \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=GuitarFans, OU=GuitarFans, O=GuitarFans, L=City, S=State, C=RU" \
              -storepass lexx311285 \
              -keypass lexx311285 \
              -noprompt
          fi

      - name: Build with Buildozer (Initial)
        run: |
          yes | buildozer android debug 2>&1 | tee buildozer_build.log

      - name: Patch Generated AndroidManifest.xml and Repackage
        run: |
          MANIFEST_PATH=$(find .buildozer -name "AndroidManifest.xml" -path "*/src/main/*" | head -n 1)
          if [ -n "$MANIFEST_PATH" ]; then
            echo "Найден готовый манифест: $MANIFEST_PATH"
            python3 - <<EOF
          path = '$MANIFEST_PATH'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          if 'networkSecurityConfig' not in content and '<application ' in content:
              content = content.replace(
                  '<application ',
                  '<application android:networkSecurityConfig="@xml/network_security_config" ',
                  1
              )
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('✅ Атрибут networkSecurityConfig добавлен, переупаковываем APK...')
          else:
              print('ℹ️ Атрибут networkSecurityConfig уже на месте.')
          EOF
            yes | buildozer android debug 2>&1 | tee -a buildozer_build.log
          fi

      - name: Rename APK with GuitarFans and Version
        run: |
          python3 - <<'EOF'
          import glob, os, shutil

          ver = os.environ['version']
          apks = glob.glob('bin/*.apk')
          if not apks:
              raise FileNotFoundError("APK не найден в папке bin/")

          src_apk = apks
          dst_apk = f"bin/GuitarFans-{ver}.apk"
          if src_apk != dst_apk:
              shutil.move(src_apk, dst_apk)
          print(f"✅ Итоговый APK переименован в: {dst_apk}")
          EOF

      - name: Upload APK to Yandex Disk
        if: success()
        env:
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
          ARTIFACT_PATH: bin
          REMOTE_DIR: /github-artifacts
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'EOF'
          import os, glob, requests, sys

          token = os.environ.get('YANDEX_DISK_TOKEN', '').strip()
          if not token:
              print("❌ Секрет YANDEX_DISK_TOKEN пустой!")
              sys.exit(1)

          local_dir = os.environ['ARTIFACT_PATH']
          remote_dir = os.environ['REMOTE_DIR']
          run_number = os.environ['RUN_NUMBER']
          headers = {'Authorization': f'OAuth {token}'}

          api_upload = 'https://yandex.net'
          api_mkdir  = 'https://yandex.net'

          # Создаём корневую папку и папку сборки
          for folder in [remote_dir, f'{remote_dir}/run-{run_number}']:
              r = requests.put(api_mkdir, headers=headers, params={'path': folder})
              if r.status_code not in (200, 201, 409):
                  print(f"❌ Ошибка создания папки {folder}: {r.status_code} {r.text}")
                  sys.exit(1)

          run_dir = f'{remote_dir}/run-{run_number}'
          apks = glob.glob(os.path.join(local_dir, '*.apk'))
          if not apks:
              print("❌ APK файлы не найдены в bin/")
              sys.exit(1)

          for apk in apks:
              name = os.path.basename(apk)
              remote_path = f'{run_dir}/{name}'
              r = requests.get(api_upload, headers=headers, params={'path': remote_path, 'overwrite': 'true'})
              if r.status_code != 200:
                  print(f"❌ Ошибка получения ссылки загрузки: {r.status_code} {r.text}")
                  sys.exit(1)
              data = r.json()
              with open(apk, 'rb') as f:
                  up = requests.put(data['href'], data=f)
              if up.status_code not in (200, 201, 202):
                  print(f"❌ Ошибка загрузки файла: {up.status_code} {up.text}")
                  sys.exit(1)
              print(f"✅ Успешно загружен на Яндекс.Диск: {remote_path}")
          EOF

      - name: Upload build log to Yandex Disk
        if: always()
        env:
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'EOF'
          import os, requests, sys

          token = os.environ.get('YANDEX_DISK_TOKEN', '').strip()
          if not token:
              sys.exit(0)

          run_number = os.environ['RUN_NUMBER']
          log_file = 'buildozer_build.log'
          if not os.path.exists(log_file):
              sys.exit(0)

          headers = {'Authorization': f'OAuth {token}'}
          api_mkdir = 'https://yandex.net'
          for folder in ['/github-artifacts', f'/github-artifacts/run-{run_number}']:
              requests.put(api_mkdir, headers=headers, params={'path': folder})

          remote_path = f'/github-artifacts/run-{run_number}/{log_file}'
          r = requests.get('https://yandex.net', headers=headers, params={'path': remote_path, 'overwrite': 'true'})
          if r.status_code != 200:
              print(f"⚠️ Не удалось получить ссылку для лога: {r.status_code} {r.text}")
              sys.exit(0)
          with open(log_file, 'rb') as f:
              up = requests.put(r.json()['href'], data=f)
          print(f"📄 Лог загружен: статус {up.status_code}")
          EOF
      
