name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: |
          echo "date=$(date -u '+%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-buildozer-global-

      - name: Cache Buildozer directory in app
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-app-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-buildozer-app-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/android-sdk
          key: ${{ runner.os }}-android-sdk-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/android-ndk
          key: ${{ runner.os }}-android-ndk-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-android-ndk-

      - name: Clean buildozer cache
        run: |
          rm -rf .buildozer || true
          rm -rf ~/.buildozer/android/platform/python-for-android || true
          rm -rf ~/.buildozer/android/platform/android-ndk-* || true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev libunwind-dev zlib1g-dev autoconf-archive \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev uuid-dev \
            libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            zip unzip autoconf libtool automake libltdl-dev m4 pkg-config \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev autopoint gettext \
            libgstreamer-plugins-base1.0-dev

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Build with Buildozer (debug full output)
        run: |
          echo "::group::🔨 Building APK..."
          yes | buildozer -v android debug 2>&1 | tee build.log
          echo "::endgroup::"

      - name: Show build errors
        if: always()
        run: |
          echo "::group::🔍 Searching for errors in build.log..."
          if [ -f build.log ]; then
            echo "=== ERRORS ==="
            grep -i -E "(error|failed|fatal|traceback|exception|crash|fail)" build.log || echo "No errors found in grep"
            echo ""
            echo "=== LAST 50 LINES ==="
            tail -50 build.log
          else
            echo "build.log not found!"
          fi
          echo "::endgroup::"

      - name: Show bin directory content
        if: always()
        run: |
          echo "::group::📂 bin directory content"
          if [ -d "bin" ]; then
            ls -la bin/ || echo "bin directory is empty"
          else
            echo "bin directory does not exist!"
          fi
          echo "::endgroup::"

      - name: Check build status
        if: always()
        run: |
          echo "::group::📊 Build Status"
          if [ -d "bin" ] && [ "$(ls -A bin/*.apk 2>/dev/null)" ]; then
            echo "✅ APK created successfully!"
            echo "::notice::✅ APK создан успешно!"
            ls -la bin/
          else
            echo "❌ APK not found!"
            echo "::error::❌ APK не найден!"
            echo "Check build.log for details"
            exit 1
          fi
          echo "::endgroup::"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GuitarFuns-APK-${{ github.run_number }}
          path: bin/*.apk