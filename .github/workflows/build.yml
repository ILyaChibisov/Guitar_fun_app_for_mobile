name: Android Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Get Date
        id: get-date
        run: |
          echo "date=$(date -u '+%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-buildozer-global-

      - name: Cache Buildozer directory in app
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-app-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-buildozer-app-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/android-sdk
          key: ${{ runner.os }}-android-sdk-${{ env.date }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt-get install -y \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev libunwind-dev zlib1g-dev autoconf-archive \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev openssl \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev uuid-dev \
            libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            zip unzip autoconf libtool automake libltdl-dev m4 pkg-config \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev autopoint gettext \
            libgstreamer-plugins-base1.0-dev

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.37

      # 🔥 СОБИРАЕМ С ФИЛЬТРАЦИЕЙ ОШИБОК
      - name: Build with Buildozer (filtered)
        run: |
          echo "::group::🔨 Building APK..."
          buildozer -v android debug 2>&1 | tee build.log | grep -i -E "(error|failed|fatal|traceback|exception|indexerror|keyerror)" || true
          echo "::endgroup::"

      # 🔥 ПОКАЗЫВАЕМ ТОЛЬКО ОШИБКИ
      - name: Show errors only
        if: always()
        run: |
          echo "========================================="
          echo "=== 🔴 ERRORS ONLY ==="
          echo "========================================="
          echo ""
          grep -i -E "(error|failed|fatal|traceback|exception|indexerror|keyerror)" build.log | head -100 || echo "✅ No errors found!"
          echo ""
          echo "========================================="
          echo "=== 📋 LAST 20 LINES WITH CONTEXT ==="
          echo "========================================="
          tail -20 build.log || echo "Log file not found"

      # 🔥 ПОКАЗЫВАЕМ ТОЛЬКО libthorvg ОШИБКИ
      - name: Show libthorvg errors
        if: always()
        run: |
          echo "========================================="
          echo "=== 📦 libthorvg ERRORS ==="
          echo "========================================="
          grep -A 10 -B 5 "libthorvg" build.log || echo "No libthorvg errors found"

      - name: Check if APK exists
        if: always()
        run: |
          echo "========================================="
          echo "=== 📱 CHECKING APK ==="
          echo "========================================="
          if [ -d "bin" ] && [ "$(ls -A bin/*.apk 2>/dev/null)" ]; then
            echo "✅ APK FOUND!"
            ls -la bin/
          else
            echo "❌ APK NOT FOUND!"
            echo "::error:: APK не найден! Проверьте ошибки выше."
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GuitarFuns-APK-${{ github.run_number }}
          path: bin/*.apk

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
